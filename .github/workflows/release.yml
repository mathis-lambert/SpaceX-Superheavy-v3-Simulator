name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing alpha tag to build and publish
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  source:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        name: Validate release source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_ENVIRONMENT: ${{ vars.RELEASES_ENVIRONMENT }}
          UE_WINDOWS_RUNNER: ${{ vars.UE_WINDOWS_RUNNER }}
          UE_ROOT: ${{ vars.UE_ROOT }}
        run: |
          test -n "$RELEASE_ENVIRONMENT" || { echo 'Set repository variable RELEASES_ENVIRONMENT to the GitHub environment holding S3 secrets'; exit 1; }
          test -n "$UE_WINDOWS_RUNNER" && test -n "$UE_ROOT" || { echo 'Configure UE_WINDOWS_RUNNER and UE_ROOT for a GitHub-hosted Windows runner with Unreal preinstalled'; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]] || { echo 'Invalid alpha tag'; exit 1; }
          commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/main
          git cat-file -e "$commit:Tools/Runtime/build_release.ps1"
          version=$(git show "$commit:Config/DefaultGame.ini" | sed -n 's/^ProjectVersion=//p' | tr -d '\r')
          test "$RELEASE_TAG" = "v$version"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
  checks:
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.source.outputs.commit }}
  windows:
    needs: [source, checks]
    runs-on: ${{ vars.UE_WINDOWS_RUNNER }}
    timeout-minutes: 240
    env:
      UE_ROOT: ${{ vars.UE_ROOT }}
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
    steps:
      - name: Require GitHub-hosted build machine
        shell: pwsh
        env:
          RUNNER_ENVIRONMENT_KIND: ${{ runner.environment }}
        run: |
          if ($env:RUNNER_ENVIRONMENT_KIND -ne 'github-hosted') { throw 'This workflow requires a GitHub-hosted runner' }
          if (!$env:UE_ROOT -or !(Test-Path "$env:UE_ROOT/Engine/Build/BatchFiles/Build.bat")) { throw 'Configure the runner image with Unreal and UE_ROOT before running a release' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, test models, cook and verify archive
        shell: pwsh
        run: ./Tools/Runtime/build_release.ps1 -EngineRoot $env:UE_ROOT -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Releases/upload/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation-${{ github.run_id }}
          path: |
            Saved/Recovery/CIPhysics*
            Saved/Recovery/Alpha-*
          retention-days: 14
  publish:
    needs: [source, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ${{ vars.RELEASES_ENVIRONMENT }}
    env:
      AWS_CLI_VERSION: '2.36.50'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - name: Install pinned AWS CLI
        run: |
          curl --fail --silent --show-error --location "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${AWS_CLI_VERSION}.zip" -o "$RUNNER_TEMP/aws.zip"
          unzip -q "$RUNNER_TEMP/aws.zip" -d "$RUNNER_TEMP/aws-install"
          "$RUNNER_TEMP/aws-install/aws/install" --install-dir "$RUNNER_TEMP/aws-cli" --bin-dir "$RUNNER_TEMP/aws-bin"
          echo "$RUNNER_TEMP/aws-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/aws-bin/aws" --version
      - name: Verify and publish release
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.RELEASES_S3_REGION || 'us-east-1' }}
          AWS_CONFIG_FILE: ${{ runner.temp }}/release-aws-config
          RELEASES_S3_ENDPOINT: ${{ vars.RELEASES_S3_ENDPOINT }}
          RELEASES_S3_BUCKET: ${{ vars.RELEASES_S3_BUCKET }}
          RELEASES_PUBLIC_BASE_URL: ${{ vars.RELEASES_PUBLIC_BASE_URL }}
          FORCE_PATH_STYLE: ${{ vars.RELEASES_S3_FORCE_PATH_STYLE || 'true' }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$RELEASES_S3_ENDPOINT" && test -n "$RELEASES_S3_BUCKET" && test -n "$RELEASES_PUBLIC_BASE_URL"
          case "$FORCE_PATH_STYLE" in
            true) aws configure set default.s3.addressing_style path ;;
            false) aws configure set default.s3.addressing_style virtual ;;
            *) echo 'Invalid RELEASES_S3_FORCE_PATH_STYLE'; exit 1 ;;
          esac
          python Tools/Runtime/publish_release.py dist --repository "$REPOSITORY_NAME" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"

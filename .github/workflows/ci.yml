name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Tools/Tests/requirements-ci.txt
      - run: python -m pip install -r Tools/Tests/requirements-ci.txt
      - name: Python syntax
        run: python -m compileall -q Tools
      - name: Regression tests
        run: python -m unittest discover -s Tools/Tests -p 'test_*.py' -v
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem Tools -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $errors += $parseErrors
          }
          if ($errors.Count) { $errors | Format-List; throw 'PowerShell syntax errors' }
